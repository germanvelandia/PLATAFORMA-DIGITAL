<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FantasyClass Convivencial - Colegio Alfonso López Michelsen</title>
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; min-height: 100vh; }
        .glass-panel { background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.12); }
        .card-hover { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 12px 24px -10px rgba(245, 158, 11, 0.25); border-color: rgba(245, 158, 11, 0.4); }
    </style>
</head>
<body class="p-6">

    <!-- Header -->
    <header class="glass-panel max-w-7xl mx-auto p-4 rounded-3xl mb-6 flex justify-between items-center shadow-lg border border-white/10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-tr from-red-600 via-blue-800 to-amber-500 rounded-2xl flex items-center justify-center font-black text-amber-300">ALM</div>
            <div>
                <h1 class="font-display font-black text-lg text-white">FantasyClass Convivencial</h1>
                <p class="text-[10px] text-slate-400">Colegio Alfonso López Michelsen</p>
            </div>
        </div>
        <button id="add-btn" class="bg-emerald-600 px-4 py-2 rounded-xl font-bold text-xs hover:bg-emerald-500 transition">
            + Añadir Estudiante
        </button>
    </header>

    <!-- Dashboard Métricas -->
    <div class="max-w-7xl mx-auto grid grid-cols-6 gap-4 mb-6">
        <!-- Puedes replicar las tarjetas de los 6 pilares aquí -->
    </div>

    <!-- Grilla de Estudiantes -->
    <main class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-4" id="students-grid">
        <!-- Las tarjetas se generan por JS -->
    </main>

    <script>
        // Lógica base
        const estudiantes = [
            { nombre: "Alan Felipe Llanos", nivel: 1, xp: 9 },
            { nombre: "Alison Maria Gracia", nivel: 1, xp: 9 }
        ];

        function render() {
            const grid = document.getElementById('students-grid');
            grid.innerHTML = estudiantes.map(e => `
                <div class="glass-panel p-4 rounded-3xl card-hover flex flex-col gap-4">
                    <div class="flex justify-between items-center">
                        <span class="bg-amber-500/20 text-amber-300 text-[10px] px-2 py-1 rounded-full font-bold">NIVEL ${e.nivel}</span>
                        <span class="text-emerald-400 text-xs font-bold">+ ${e.xp} pts</span>
                    </div>
                    <h2 class="font-bold text-sm truncate">${e.nombre}</h2>
                    <div class="grid grid-cols-2 gap-2">
                        <button class="bg-emerald-600/50 py-1.5 rounded-xl text-[10px] font-bold">Mérito</button>
                        <button class="bg-red-600/50 py-1.5 rounded-xl text-[10px] font-bold">Falta</button>
                    </div>
                </div>
            `).join('');
        }
        render();
    </script>
</body>
</html>
