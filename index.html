<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FantasyClass Convivencial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle at top center, #1e293b 0%, #0f172a 100%); color: white; min-height: 100vh; font-family: sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="p-6">
    <div id="app" class="max-w-6xl mx-auto">
        <header class="glass p-6 rounded-3xl mb-6 shadow-xl flex justify-between items-center">
            <h1 class="text-2xl font-black text-amber-400">FantasyClass ALM</h1>
            <button id="add-btn" class="bg-emerald-600 px-4 py-2 rounded-xl font-bold text-sm hover:bg-emerald-500 transition">
                + Añadir Estudiante
            </button>
        </header>

        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- Aquí irán los estudiantes -->
        </div>
    </div>

    <script>
        // Lógica inicial básica
        const estudiantes = [
            { id: 1, nombre: "Ejemplo Estudiante" }
        ];

        function render() {
            const grid = document.getElementById('grid');
            grid.innerHTML = estudiantes.map(e => `
                <div class="glass p-4 rounded-2xl hover:border-amber-500/50 transition">
                    <h2 class="font-bold">${e.nombre}</h2>
                    <button class="mt-2 text-xs bg-sky-600 px-3 py-1 rounded-lg">Ver Ficha</button>
                </div>
            `).join('');
        }

        render();
    </script>
</body>
</html>
