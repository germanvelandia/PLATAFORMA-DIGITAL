<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Critical Quest: Inicio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <h1>Critical Quest</h1>
        <p>Bienvenido, aventurero. Identifícate para comenzar.</p>

        <form id="loginForm">
            <input type="text" id="studentName" placeholder="Tu nombre" required>
            
            <select id="clanSelect">
                <option value="">Selecciona tu Clan</option>
                <option value="Clan Alfa">Clan Alfa</option>
                <option value="Clan Beta">Clan Beta</option>

            <button type="submit">Entrar al Mapa</button>
        </form>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
