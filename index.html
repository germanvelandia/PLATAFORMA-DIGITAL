<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FantasyClass Convivencial | ALM</title>
    <!-- Cargamos Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle at top center, #1e293b 0%, #0f172a 100%); color: white; min-height: 100vh; }
        .glass { background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="p-4 md:p-6">
    
    <div id="app" class="max-w-7xl mx-auto space-y-6">
        <!-- HEADER -->
        <header class="glass p-6 rounded-3xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-black text-amber-400">FantasyClass ALM</h1>
                <p class="text-xs text-slate-400">Panel de Control Convivencial</p>
            </div>
            <div id="global-stats" class="flex gap-4">
                <!-- Aquí irán los 6 pilares de métricas -->
            </div>
        </header>

        <!-- GRILLA DE ESTUDIANTES -->
        <div id="students-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- Las tarjetas de los estudiantes se inyectarán aquí -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
