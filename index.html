<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FantasyClass Convivencial</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./print.css" media="print">
</head>
<body>

  <!-- BARRA SUPERIOR INSTITUCIONAL -->
  <header class="top-header no-print">
    <div class="header-brand">
      <div class="logo-badge">ALM</div>
      <div class="brand-info">
        <h1>FantasyClass Convivencial <span class="badge-sub">ALM</span></h1>
        <p>Colegio Alfonso López Michelsen — "Una Vida para la Excelencia"</p>
      </div>
    </div>

    <div class="header-controls">
      <button class="btn-tool dark-btn">☁️ Sync Drive</button>
      <select id="selectPeriodo" class="header-select">
        <option value="P1">Periodo 1</option>
        <option value="P2">Periodo 2</option>
        <option value="P3">Periodo 3</option>
        <option value="P4">Periodo 4</option>
      </select>

      <select id="selectGrado" class="header-select">
        <option value="801">Grado 801 (32 Est.)</option>
        <option value="802">Grado 802 (30 Est.)</option>
        <option value="1001">Grado 1001 (35 Est.)</option>
      </select>

      <button class="btn-tool dark-btn" onclick="abrirGrupos()">👥 Grupos</button>
      <button class="btn-tool green-btn" onclick="exportarExcel()">📊 Exportar Excel ▾</button>
    </div>
  </header>

  <!-- BARRA DE HERRAMIENTAS RÁPIDAS -->
  <div class="toolbar no-print">
    <div class="tools-center">
      <button class="tool-chip" onclick="lanzarDado()">🎲 Dado</button>
      <button class="tool-chip" onclick="abrirTemporizador()">⏱️ Tiempo</button>
      <button class="tool-chip purple-chip" onclick="lanzarRuleta()">🔄 Ruleta</button>
    </div>
  </div>

  <main class="main-content">

    <!-- SECCIÓN DE MÉTRICAS / VALORES CONVIVENCIALES -->
    <div class="metrics-bar no-print">
      <div class="metric-card">
        <span class="icon">🦏</span>
        <div>
          <div class="title">RESPONSABILIDAD</div>
          <div class="value" id="val-responsabilidad">6 pts</div>
        </div>
      </div>
      <div class="metric-card">
        <span class="icon">🦊</span>
        <div>
          <div class="title">RESPETO</div>
          <div class="value" id="val-respeto">15 pts</div>
        </div>
      </div>
      <div class="metric-card">
        <span class="icon">🐪</span>
        <div>
          <div class="title">CONFIANZA</div>
          <div class="value" id="val-confianza">0 pts</div>
        </div>
      </div>
      <div class="metric-card">
        <span class="icon">❤️</span>
        <div>
          <div class="title">EMPATÍA</div>
          <div class="value" id="val-empatia">0 pts</div>
        </div>
      </div>
      <div class="metric-card">
        <span class="icon">⚖️</span>
        <div>
          <div class="title">JUSTICIA</div>
          <div class="value" id="val-justicia">0 pts</div>
        </div>
      </div>
      <div class="metric-card">
        <span class="icon">🛡️</span>
        <div>
          <div class="title">CIUDADANÍA</div>
          <div class="value" id="val-ciudadania">0 pts</div>
        </div>
      </div>
    </div>

    <!-- BÚSQUEDA Y ACCIONES -->
    <div class="action-bar no-print">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="inputBuscar" placeholder="Buscar estudiante por nombre..." oninput="filtrarEstudiantes()">
      </div>

      <div class="sort-and-add">
        <label>Ordenar:</label>
        <select id="selectOrden" class="select-sort" onchange="ordenarEstudiantes()">
          <option value="nombreAZ">Nombre (A-Z)</option>
          <option value="puntosDesc">Puntos (Mayor a Menor)</option>
        </select>
        <button class="btn-add-student" onclick="abrirModalAgregar()">+ Añadir Estudiante</button>
      </div>
    </div>

    <!-- GRILLA DE ESTUDIANTES -->
    <div class="students-grid" id="gridEstudiantes">
      <!-- Las tarjetas se generan dinámicamente desde JavaScript -->
    </div>

  </main>

  <script src="./app.js" defer></script>
</body>
</html>
